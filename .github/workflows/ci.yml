name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  maintenance:
    name: Order maintenance — database and HTTP integration
    needs: mobile
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: reda_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: reda_eod_test
        ports: ['55449:5432']
        options: >-
          --health-cmd "pg_isready -U reda_test -d reda_eod_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      postgrest:
        image: postgrest/postgrest:v14.12
        env:
          PGRST_DB_URI: postgres://reda_test:isolated-test-only@postgres:5432/reda_eod_test
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_DB_PRE_REQUEST: public.check_payment_client_contract
          PGRST_JWT_SECRET: isolated-reda-eod-test-secret-at-least-32-characters
        ports: ['55451:3000']
    env:
      PGPASSWORD: isolated-test-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.7.1'
      - run: node tools/eod-reliability-20260921/test-runner.mjs --setup
      - run: node tools/notification-policy-20261016/test-database.mjs
      - run: node tools/waybill-stock/test.mjs
      - run: node tools/manual-fee-waivers/test-runner.mjs
      - run: node tools/manual-fee-waivers/test-concurrency.mjs
      - name: Reload API schema
        run: psql -h 127.0.0.1 -p 55449 -U reda_test -d reda_eod_test -c "NOTIFY pgrst, 'reload schema';"
      - name: Exercise actual scheduled HTTP client and private worker permissions
        run: deno test --no-check --no-config --node-modules-dir=none --allow-net=127.0.0.1:55451,127.0.0.1:55452 --allow-env tools/test-eod-compatibility.ts
      - name: Measure immediate manual EOD through real HTTP and committed batches
        run: node tools/eod-reliability-20260921/test-immediate-http.mjs
      - name: Phone search matching rules
        run: node --experimental-strip-types --test mobile/src/lib/delivery-search.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: eod-test-web
          path: mobile/dist
      - name: Install browser for real EOD integration
        run: |
          npm install --prefix "$RUNNER_TEMP/eod-browser" --no-save playwright@1.55.0
          node "$RUNNER_TEMP/eod-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify click-to-completion, lost responses and reload against real HTTP
        run: node tools/eod-reliability-20260921/test-immediate-http.mjs --browser-only
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/eod-browser/node_modules/playwright
      - name: Verify phone search through real browser, API and indexed database
        run: node --experimental-strip-types tools/eod-reliability-20260921/test-phone-search.mjs --browser
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/eod-browser/node_modules/playwright
      - name: Verify policy-closure wording and genuine failure labels
        run: node --experimental-strip-types tools/eod-reliability-20260921/test-closure-display.mjs
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/eod-browser/node_modules/playwright
      - name: Verify atomic Review saves, concurrent devices and slow/lost responses
        run: node tools/eod-reliability-20260921/test-review-save.mjs --browser
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/eod-browser/node_modules/playwright
      - run: deno test --no-config supabase/functions/_shared/push-batch.test.ts

  mobile:
    name: Mobile app — typecheck + lint + format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Urgent stock and Altior regression tests
        run: |
          node --experimental-strip-types --test src/lib/stock-signal.test.mjs ../tools/urgent-ab-20261016/manual-refresh.test.mjs
          node --test ../tools/altior-age-20261016/altior-report.test.mjs
      - name: Call, blacklist and stock-sharing regression tests
        run: |
          npm run test:calls
          npm run test:blacklist-notices
          npm run test:share-report
          npm run test:stock-summary
          node ../tools/test-client-stock-share.mjs
      - name: Build isolated workflow UI
        run: npx expo export --platform web --max-workers 2
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://api.redalogisticss.com
          EXPO_PUBLIC_SUPABASE_ANON_KEY: isolated-ui-test
      - name: Install workflow test browser
        run: |
          npm install --prefix "$RUNNER_TEMP/eod-browser" --no-save playwright@1.55.0
          node "$RUNNER_TEMP/eod-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Shared Android/web confirmations and stock movement layout
        run: |
          node ../tools/test-cross-platform-alerts.mjs
          node ../tools/eod-reliability-20260921/test-stock-wrap.mjs
          node ../tools/waybill-stock/test-ui.mjs
          node ../tools/test-client-report-share-ui.mjs
        env:
          ALERT_TEST_BROWSER: chromium
          ALERT_TEST_WEB_BUILD: '1'
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/eod-browser/node_modules/playwright/index.mjs
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/eod-browser/node_modules/playwright
          EOD_UI_DIST: dist
          SHARE_UI_DIST: dist
      - name: Stock refresh and Altior report acceptance
        run: |
          node ../tools/urgent-ab-20261016/stock-acceptance.mjs
          node ../tools/altior-age-20261016/altior-share-acceptance.mjs
        env:
          STOCK_UI_DIST: dist
          ALTIOR_UI_DIST: dist
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/eod-browser/node_modules/playwright
      - uses: actions/upload-artifact@v4
        with:
          name: eod-test-web
          path: mobile/dist
          retention-days: 1
      - name: Exercise end of day and assignment at phone and desktop widths
        run: |
          for width in 390 1280; do
            EOD_UI_WIDTH="$width" node ../tools/eod-reliability-20260921/test-manual-eod-ui.mjs
          done
        env:
          EOD_UI_DIST: dist
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/eod-browser/node_modules/playwright
      - name: Exercise rider fee changes and handover at phone and desktop widths
        run: |
          for width in 390 1280; do
            EOD_UI_WIDTH="$width" node ../tools/manual-fee-waivers/test-ui.mjs
          done
          for edge in missing confirm; do
            EOD_UI_WIDTH=390 FEE_UI_EDGE_CASE="$edge" node ../tools/manual-fee-waivers/test-ui.mjs
          done
        env:
          EOD_UI_DIST: dist
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/eod-browser/node_modules/playwright

  urgent-backend:
    name: JQ matching and Altior report projection
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: reda_altior_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: reda_altior_test
          PGPORT: 55459
        ports: ['55459:55459']
        options: >-
          --health-cmd "pg_isready -U reda_altior_test -d reda_altior_test -p 55459"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: isolated-test-only
      PGPORT: '55459'
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.7.1'
      - name: Admin notification regression and acceptance
        run: deno test --no-lock --node-modules-dir=none --allow-env=SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,INTERNAL_FUNCTION_SECRET tools/notification-policy-20261016/handler.test.ts supabase/functions/_shared/push-batch.test.ts
      - name: Parser regression and acceptance
        run: deno test --no-lock --node-modules-dir=none --allow-env=SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,INTERNAL_FUNCTION_SECRET,OPENROUTER_API_KEY tools/urgent-ab-20261016/parser-acceptance.test.ts supabase/functions/_shared/product-hint.test.ts supabase/functions/_shared/product-extract.test.ts supabase/functions/_shared/vendor-classify.test.ts supabase/functions/_shared/order-total.test.ts supabase/functions/_shared/perfume-gifts.test.ts
      - name: Altior SQL projection and idempotency
        env:
          TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          sql() { docker exec -e PGPASSWORD -i "$TEST_PG_CONTAINER" psql -X -h 127.0.0.1 -p 55459 -U reda_altior_test -d reda_altior_test -v ON_ERROR_STOP=1 "$@"; }
          sql < tools/altior-age-20261016/report-fixture.sql
          sql < tools/live-defs/client_remit_detail_rep_before_altior_20261016.sql
          sql -c 'REVOKE ALL ON FUNCTION public.client_remit_detail_rep(uuid,date,date) FROM PUBLIC; GRANT EXECUTE ON FUNCTION public.client_remit_detail_rep(uuid,date,date) TO altior_report_caller;'
          for attempt in 1 2; do
            sql < supabase/migrations/20261016170000_altior_delivered_update.sql
            sql < tools/altior-age-20261016/report-cases.sql
          done

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No service_role key referenced in mobile/
        run: |
          if grep -RIn --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' 'service_role\|sb_secret_' mobile/; then
            echo "❌ Server-only key referenced in mobile/. Use the publishable/anon key only."
            exit 1
          fi
